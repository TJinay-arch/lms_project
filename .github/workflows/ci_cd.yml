name: CI/CD

on: [ push ]


jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install poetry
          poetry config virtualenvs.create false
          poetry install --no-root 

      - name: Run tests
        env:
          SECRET_KEY: 123456
          DATABASE_NAME: test_db
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          REDIS_HOST: localhost
        run: |
          pytest

  deploy:
    runs-on: ubuntu-latest
    #needs: test

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/${{ secrets.SERVER_USER }}/lms_project
            git pull
            # Создаём .env из секрета GitHub
            echo "${{ secrets.DJANGO_ENV_FILE }}" > .env
            
            # Проверка и установка Poetry
            if ! command -v poetry &> /dev/null; then
              echo "Poetry not found, installing..."
              curl -sSL https://install.python-poetry.org | python3 -
            fi
            
            /home/$USER/.local/bin/poetry install --only main
            /home/$USER/.local/bin/poetry run python3 manage.py migrate
            sudo systemctl restart gunicorn